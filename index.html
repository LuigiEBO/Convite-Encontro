<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tenho um convite pra você 💌</title>
<style>
  :root { --rosa:#ff5d8f; --rosa-escuro:#d6336c; --fundo1:#ffe3ec; --fundo2:#ffc2d6; --texto:#4a2030; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif; color:var(--texto);
    background: linear-gradient(135deg, var(--fundo1), var(--fundo2));
    min-height:100%; overflow-x:hidden;
  }
  .tela { display:none; min-height:100vh; padding:24px; align-items:center; justify-content:center; flex-direction:column; text-align:center; position:relative; z-index:2; }
  .tela.ativa { display:flex; animation: entrar .5s ease; }
  @keyframes entrar { from {opacity:0; transform:translateY(16px);} to {opacity:1; transform:none;} }

  .cartao { background:rgba(255,255,255,.85); backdrop-filter:blur(6px); border-radius:24px; padding:32px 24px; max-width:460px; width:100%; box-shadow:0 12px 40px rgba(214,51,108,.2); }
  h1 { font-size:1.8rem; margin-bottom:8px; }
  h2 { font-size:1.5rem; margin-bottom:16px; }
  p.sub { margin-bottom:20px; opacity:.8; }
  .emoji-grande { font-size:4rem; margin-bottom:12px; }

  button { font:inherit; cursor:pointer; border:none; border-radius:999px; padding:14px 32px; font-weight:600; font-size:1.05rem; transition:transform .15s, box-shadow .15s; }
  .btn-sim, .btn-main { background:var(--rosa); color:#fff; box-shadow:0 6px 16px rgba(255,93,143,.45); }
  .btn-sim:hover, .btn-main:hover { transform:scale(1.06); }
  .btn-sec { background:#fff; color:var(--rosa-escuro); border:2px solid var(--rosa); }
  .btn-nao { background:#e9ecef; color:#555; }
  .botoes { display:flex; gap:16px; justify-content:center; align-items:center; flex-wrap:wrap; margin-top:12px; min-height:60px; }
  .btn-nao.fugindo { position:fixed; z-index:50; transition:left .25s ease, top .25s ease; }

  label { display:block; text-align:left; font-weight:600; margin:16px 0 6px; }
  input[type=date], input[type=time], input[type=text], textarea {
    width:100%; padding:12px 14px; border-radius:14px; border:2px solid #f3c1d2; font:inherit; background:#fff;
  }
  input:focus, textarea:focus { outline:none; border-color:var(--rosa); }
  .lugares { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .lugar { border:2px solid #f3c1d2; border-radius:16px; padding:12px 8px; background:#fff; cursor:pointer; font-size:.95rem; transition:.15s; user-select:none; }
  .lugar .ico { font-size:1.8rem; display:block; }
  .lugar.sel { border-color:var(--rosa); background:#fff0f5; transform:scale(1.03); box-shadow:0 4px 12px rgba(255,93,143,.3); }
  .erro { color:#c92a2a; font-size:.9rem; margin-top:10px; min-height:1.2em; }

  .resumo { text-align:left; background:#fff; border-radius:16px; padding:16px; margin-bottom:16px; }
  .resumo div { padding:8px 0; border-bottom:1px dashed #f3c1d2; }
  .resumo div:last-child { border:none; }
  .resumo b { color:var(--rosa-escuro); }

  .coracao { position:fixed; bottom:-40px; z-index:1; opacity:.5; animation: subir linear infinite; pointer-events:none; }
  @keyframes subir { to { transform:translateY(-115vh) rotate(25deg); } }

  .foto-wrap { width:210px; height:280px; margin:0 auto 14px; border-radius:20px; overflow:hidden; border:4px solid #fff; box-shadow:0 8px 24px rgba(214,51,108,.35); transform:rotate(-2deg); }
  .foto-wrap img { width:100%; height:100%; object-fit:cover; display:block; }
  .aguardo { font-size:1.35rem; font-weight:700; color:var(--rosa-escuro); margin-bottom:14px; }
  .contagem { display:flex; gap:8px; justify-content:center; margin:8px 0 16px; }
  .contagem div { background:#fff; border-radius:14px; padding:10px 6px; min-width:64px; box-shadow:0 4px 12px rgba(255,93,143,.25); }
  .contagem b { display:block; font-size:1.6rem; color:var(--rosa-escuro); }
  .contagem span { font-size:.75rem; opacity:.7; }
  .quando { font-size:.95rem; opacity:.85; margin-bottom:6px; }
</style>
</head>
<body>

<!-- TELA 1: PERGUNTA -->
<section class="tela ativa" id="t1">
  <div class="cartao">
    <div class="emoji-grande">🥰</div>
    <h1>Você quer sair comigo?</h1>
    <p class="sub">Pensa bem na resposta... 😏</p>
    <div class="botoes" id="areaBotoes">
      <button class="btn-sim" id="btnSim">Sim 💖</button>
      <button class="btn-nao" id="btnNao">Não</button>
    </div>
  </div>
</section>

<!-- TELA 2: FORMULÁRIO -->
<section class="tela" id="t2">
  <div class="cartao">
    <h2>Eba! Vamos combinar 🎉</h2>

    <label for="data">Que dia fica bom pra você?</label>
    <input type="date" id="data">

    <label for="hora">Em qual horário?</label>
    <input type="time" id="hora">

    <label>Pra onde você quer ir?</label>
    <div class="lugares" id="lugares">
      <div class="lugar" data-v="Jantar 🍝"><span class="ico">🍝</span>Jantar</div>
      <div class="lugar" data-v="Cinema 🎬"><span class="ico">🎬</span>Cinema</div>
      <div class="lugar" data-v="Sorvete 🍦"><span class="ico">🍦</span>Sorvete</div>
      <div class="lugar" data-v="Café ☕"><span class="ico">☕</span>Café</div>
      <div class="lugar" data-v="Praça / Passeio 🌳"><span class="ico">🌳</span>Passeio</div>
      <div class="lugar" data-v="Outro"><span class="ico">✨</span>Outro</div>
    </div>
    <input type="text" id="outro" placeholder="Qual lugar?" style="display:none; margin-top:10px">

    <label for="obs">Quer me falar mais alguma coisa? (opcional)</label>
    <textarea id="obs" rows="2" placeholder="Ex.: não gosto de comida apimentada..."></textarea>

    <div class="erro" id="erro"></div>
    <div class="botoes"><button class="btn-main" id="btnRevisar">Continuar 💌</button></div>
  </div>
</section>

<!-- TELA 3: REVISÃO -->
<section class="tela" id="t3">
  <div class="cartao">
    <h2>Confere se está tudo certinho 👀</h2>
    <div class="resumo" id="resumo"></div>
    <div class="botoes">
      <button class="btn-sec" id="btnVoltar">Alterar</button>
      <button class="btn-main" id="btnConfirmar">Confirmar 💘</button>
    </div>
  </div>
</section>

<!-- TELA 4: FINAL (personalize depois) -->

<script>
/* ============ CONFIGURAÇÃO — EDITE AQUI ============ */
const SEU_WHATSAPP   = "5535997692077"; // DDI + DDD + número, só dígitos
const FORMSPREE_URL  = "";              // Ex.: "https://formspree.io/f/abcdwxyz" (opcional)
const SEU_NOME       = "";              // opcional, aparece na mensagem
/* ================================================== */

const $ = id => document.getElementById(id);
const ir = n => { document.querySelectorAll('.tela').forEach(t => t.classList.remove('ativa')); $('t'+n).classList.add('ativa'); window.scrollTo(0,0); };

/* ---------- Corações flutuando ---------- */
for (let i = 0; i < 18; i++) {
  const c = document.createElement('div');
  c.className = 'coracao';
  c.textContent = ['💗','💖','💕','🌸'][i % 4];
  c.style.left = Math.random()*100 + 'vw';
  c.style.fontSize = (16 + Math.random()*24) + 'px';
  c.style.animationDuration = (8 + Math.random()*10) + 's';
  c.style.animationDelay = (-Math.random()*15) + 's';
  document.body.appendChild(c);
}

/* ---------- TELA 1: botão "Não" fugitivo ---------- */
const btnNao = $('btnNao');
const frases = ['Não','Tem certeza? 🥺','Pensa melhor!','Quase!','Não consegue, né? 😂','Desiste 😏','Clica no Sim!','Haha, tenta de novo'];
let tentativas = 0;

function fugir(e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  tentativas++;
  btnNao.textContent = frases[tentativas % frases.length];
  btnNao.classList.add('fugindo');
  const m = 12;
  const w = btnNao.offsetWidth, h = btnNao.offsetHeight;
  const maxX = window.innerWidth - w - m, maxY = window.innerHeight - h - m;
  const sim = $('btnSim').getBoundingClientRect();
  let x, y, tent = 0;
  do {
    x = m + Math.random() * Math.max(maxX - m, 0);
    y = m + Math.random() * Math.max(maxY - m, 0);
    tent++;
  } while (tent < 30 && x < sim.right + 10 && x + w > sim.left - 10 && y < sim.bottom + 10 && y + h > sim.top - 10);
  btnNao.style.left = x + 'px';
  btnNao.style.top = y + 'px';
  // o "Sim" cresce um pouquinho a cada tentativa
  $('btnSim').style.transform = 'scale(' + Math.min(1 + tentativas * 0.06, 1.7) + ')';
}
['mouseenter','pointerdown','touchstart','focus','click'].forEach(ev =>
  btnNao.addEventListener(ev, fugir, { passive: false }));

$('btnSim').addEventListener('click', () => { btnNao.style.display = 'none'; ir(2); });

/* ---------- TELA 2: formulário ---------- */
const hoje = new Date(); hoje.setMinutes(hoje.getMinutes() - hoje.getTimezoneOffset());
$('data').min = hoje.toISOString().slice(0,10);

let lugarEscolhido = '';
$('lugares').addEventListener('click', e => {
  const el = e.target.closest('.lugar'); if (!el) return;
  document.querySelectorAll('.lugar').forEach(l => l.classList.remove('sel'));
  el.classList.add('sel');
  lugarEscolhido = el.dataset.v;
  $('outro').style.display = lugarEscolhido === 'Outro' ? 'block' : 'none';
});

function dadosForm() {
  const [a,m,d] = $('data').value.split('-');
  let lugar = lugarEscolhido === 'Outro' ? ($('outro').value.trim() || 'Outro (a combinar)') : lugarEscolhido;
  return { data: `${d}/${m}/${a}`, hora: $('hora').value, lugar, obs: $('obs').value.trim() };
}

$('btnRevisar').addEventListener('click', () => {
  if (!$('data').value || !$('hora').value || !lugarEscolhido) {
    $('erro').textContent = 'Escolhe o dia, o horário e o lugar, por favor 🙈';
    return;
  }
  $('erro').textContent = '';
  const d = dadosForm();
  $('resumo').innerHTML =
    `<div>📅 <b>Dia:</b> ${d.data}</div>` +
    `<div>⏰ <b>Horário:</b> ${d.hora}</div>` +
    `<div>📍 <b>Lugar:</b> ${esc(d.lugar)}</div>` +
    (d.obs ? `<div>💬 <b>Recado:</b> ${esc(d.obs)}</div>` : '');
  ir(3);
});
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- TELA 3: confirmação ---------- */
$('btnVoltar').addEventListener('click', () => ir(2));

function mensagem() {
  const d = dadosForm();
  return `Ela disse SIM! 🎉\n📅 ${d.data} às ${d.hora}\n📍 ${d.lugar}` + (d.obs ? `\n💬 ${d.obs}` : '');
}
function abrirZap() {
  if (!SEU_WHATSAPP) return false;
  window.open(`https://wa.me/${SEU_WHATSAPP}?text=${encodeURIComponent(mensagem())}`, '_blank');
  return true;
}

$('btnConfirmar').addEventListener('click', async () => {
  const d = dadosForm();
  // 1) Aviso automático por e-mail (Formspree), se configurado
  if (FORMSPREE_URL) {
    try {
      await fetch(FORMSPREE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ dia: d.data, horario: d.hora, lugar: d.lugar, recado: d.obs, mensagem: mensagem() })
      });
    } catch (err) { console.warn('Falha ao enviar aviso', err); }
  }
  // 2) WhatsApp com mensagem pronta
  const abriu = abrirZap();
  $('fallbackZap').style.display = abriu ? 'block' : 'none';
  iniciarContagem();
  ir(4);
});
$('btnZap').addEventListener('click', abrirZap);

/* ---------- TELA 4: contagem regressiva ---------- */
let alvo = null, timer = null;
function iniciarContagem() {
  const d = dadosForm();
  alvo = new Date($('data').value + 'T' + $('hora').value + ':00');
  $('quando').textContent = '📅 ' + d.data + ' às ' + d.hora + ' · 📍 ' + d.lugar;
  clearInterval(timer);
  const tick = () => {
    let ms = alvo - new Date();
    if (ms <= 0) { $('contagem').innerHTML = '<div style="min-width:auto;padding:12px 20px"><b>É HOJE! 🥰</b></div>'; clearInterval(timer); return; }
    const s = Math.floor(ms/1000);
    $('cd-d').textContent = Math.floor(s/86400);
    $('cd-h').textContent = Math.floor(s%86400/3600);
    $('cd-m').textContent = Math.floor(s%3600/60);
    $('cd-s').textContent = s%60;
  };
  tick(); timer = setInterval(tick, 1000);
}

</script>
</body>
</html>
